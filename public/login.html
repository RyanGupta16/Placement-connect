<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PlacementIQ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="logo">PlacementIQ</h1>
                <h2 id="loginTitle">Welcome Back</h2>
                <p id="loginSubtitle">Login to continue your placement preparation</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="your.email@college.edu"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        Remember me
                    </label>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    Login
                </button>
            </form>

            <div id="adminToggle" style="margin-top: 20px; text-align: center;">
                <button type="button" class="btn-link" id="toggleAdminBtn" style="background: none; border: none; color: #2563eb; cursor: pointer; text-decoration: underline; font-size: 14px;">
                    🔐 Admin Login
                </button>
            </div>

            <div class="auth-footer">
                <p><a href="#" id="forgotPasswordLink">Forgot password?</a></p>
                <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
