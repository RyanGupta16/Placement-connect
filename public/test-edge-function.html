<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Edge Function - PlacementIQ</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #2563eb; }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover { background: #1d4ed8; }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 6px;
            overflow-x: auto;
            max-height: 500px;
            font-size: 14px;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: bold;
        }
        .status.success { background: #d1fae5; color: #065f46; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .status.info { background: #dbeafe; color: #1e40af; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Edge Function Test Page</h1>
        <p>Use this page to test the <code>analyze-resume</code> Edge Function directly.</p>
        
        <div id="status"></div>
        
        <h2>Actions:</h2>
        <button onclick="checkAuth()">1. Check Authentication</button><br>
        <button onclick="testEdgeFunction()">2. Test Edge Function</button><br>
        <button onclick="testGeminiDirect()">3. Test Gemini API Direct</button><br>
        
        <h2>Results:</h2>
        <pre id="result">Click a button above to start testing...</pre>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        const supabase = createClient(
            'https://xpkpjmnmxwaxopskwwzn.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwa3BqbW5teHdheG9wc2t3d3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzOTcyNDUsImV4cCI6MjA4MTk3MzI0NX0.O-bzDC6O14fPGoVQuj35lCMy8CRyXOwa4pnK72bM7sk'
        )

        const resultDiv = document.getElementById('result')
        const statusDiv = document.getElementById('status')

        function showStatus(message, type = 'info') {
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`
        }

        function showResult(data) {
            resultDiv.textContent = JSON.stringify(data, null, 2)
        }

        window.checkAuth = async function() {
            showStatus('Checking authentication...', 'info')
            try {
                const { data: session, error } = await supabase.auth.getSession()
                
                if (error) throw error
                
                if (session.session) {
                    showStatus('✅ User is logged in!', 'success')
                    showResult({
                        status: 'Authenticated',
                        user: session.session.user.email,
                        token_present: !!session.session.access_token,
                        expires_at: new Date(session.session.expires_at * 1000).toLocaleString()
                    })
                } else {
                    showStatus('❌ No active session. Please login first!', 'error')
                    showResult({
                        status: 'Not authenticated',
                        message: 'Go to /login.html and login first'
                    })
                }
            } catch (error) {
                showStatus('❌ Authentication check failed', 'error')
                showResult({ error: error.message })
            }
        }

        window.testEdgeFunction = async function() {
            showStatus('Testing Edge Function...', 'info')
            
            try {
                // Get session
                const { data: sessionData, error: sessionError } = await supabase.auth.getSession()
                
                if (sessionError || !sessionData.session) {
                    throw new Error('Not authenticated. Please login first!')
                }

                const session = sessionData.session
                
                // Call Edge Function
                const response = await fetch(
                    'https://xpkpjmnmxwaxopskwwzn.supabase.co/functions/v1/analyze-resume',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${session.access_token}`,
                            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwa3BqbW5teHdheG9wc2t3d3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzOTcyNDUsImV4cCI6MjA4MTk3MzI0NX0.O-bzDC6O14fPGoVQuj35lCMy8CRyXOwa4pnK72bM7sk'
                        },
                        body: JSON.stringify({
                            user_id: session.user.id,
                            resume_id: 'test-resume-' + Date.now(),
                            resume_text: `
John Doe
Software Engineer

EXPERIENCE:
- Developed web applications using React and Node.js
- Built REST APIs for e-commerce platform  
- Worked with MongoDB and PostgreSQL databases
- Implemented CI/CD pipelines

EDUCATION:
B.Tech in Computer Science
XYZ University, 2020-2024
CGPA: 8.5/10

SKILLS:
JavaScript, React, Node.js, MongoDB, Git, Docker

PROJECTS:
1. E-commerce Platform - Built with MERN stack
2. Task Manager App - React Native mobile app
                            `.trim(),
                            job_description: 'Looking for Full Stack Developer with React, Node.js, and MongoDB experience. Must have 2+ years experience. AWS and Docker knowledge is a plus.',
                            file_name: 'test_resume.pdf'
                        })
                    }
                )

                const statusCode = response.status
                const result = await response.json()

                if (response.ok) {
                    showStatus(`✅ Edge Function Success! (Status: ${statusCode})`, 'success')
                } else {
                    showStatus(`❌ Edge Function Error (Status: ${statusCode})`, 'error')
                }

                showResult({
                    status_code: statusCode,
                    response: result
                })

            } catch (error) {
                showStatus('❌ Test Failed', 'error')
                showResult({
                    error: error.message,
                    stack: error.stack
                })
            }
        }

        window.testGeminiDirect = async function() {
            showStatus('Testing Gemini API directly...', 'info')
            
            try {
                const response = await fetch(
                    'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=AIzaSyBNntr9Q7CtgEdekTgkLyPJLtM0g-ryZ9M',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: 'Say "Hello from Gemini!" if you can read this.'
                                }]
                            }]
                        })
                    }
                )

                const result = await response.json()

                if (response.ok) {
                    showStatus('✅ Gemini API is working!', 'success')
                } else {
                    showStatus('❌ Gemini API Error', 'error')
                }

                showResult({
                    status_code: response.status,
                    response: result
                })

            } catch (error) {
                showStatus('❌ Gemini API Test Failed', 'error')
                showResult({
                    error: error.message
                })
            }
        }

        // Auto-check auth on load
        window.addEventListener('load', () => {
            checkAuth()
        })
    </script>
</body>
</html>
