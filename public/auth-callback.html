<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - PlacementIQ</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .verification-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .verification-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-icon {
            font-size: 60px;
            color: #10b981;
            margin-bottom: 20px;
        }
        .error-icon {
            font-size: 60px;
            color: #ef4444;
            margin-bottom: 20px;
        }
        .message {
            margin: 20px 0;
            font-size: 18px;
            color: #333;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="verification-card">
            <h1 class="logo">PlacementIQ</h1>
            
            <div id="loading" style="display: block;">
                <div class="spinner"></div>
                <p class="message">Verifying your email...</p>
            </div>
            
            <div id="success" style="display: none;">
                <div class="success-icon">✅</div>
                <h2>Email Verified Successfully!</h2>
                <p class="message">Your account has been verified. You can now access all features.</p>
                <a href="/dashboard.html" class="btn">Go to Dashboard</a>
            </div>
            
            <div id="error" style="display: none;">
                <div class="error-icon">❌</div>
                <h2>Verification Failed</h2>
                <p class="message" id="errorMessage">The verification link is invalid or has expired.</p>
                <a href="/signup.html" class="btn">Try Again</a>
                <a href="/login.html" class="btn" style="background: #6b7280; margin-left: 10px;">Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import supabase from './js/config.js';

        async function handleEmailVerification() {
            try {
                // Get the URL parameters
                const params = new URLSearchParams(window.location.search);
                const token = params.get('token');
                const type = params.get('type');
                const error = params.get('error');
                const errorDescription = params.get('error_description');

                // Check for errors in URL
                if (error) {
                    throw new Error(errorDescription || 'Verification failed');
                }

                // Get the current session (Supabase automatically handles the token)
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();

                if (sessionError) {
                    throw sessionError;
                }

                if (session) {
                    // User is verified and logged in
                    // Create/update profile
                    const userId = session.user.id;
                    const userEmail = session.user.email;
                    const metadata = session.user.user_metadata;

                    // Create or update user profile
                    const { error: profileError } = await supabase
                        .from('user_profiles')
                        .upsert({
                            id: userId,
                            name: metadata.name || 'Student',
                            email: userEmail,
                            college: metadata.college || '',
                            branch: metadata.branch || '',
                            batch: new Date().getFullYear(),
                            current_year: metadata.year || 1,
                            cgpa: metadata.cgpa || 0,
                            skills: []
                        }, {
                            onConflict: 'id'
                        });

                    if (profileError) {
                        console.warn('Profile creation warning:', profileError);
                    }

                    // Show success
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('success').style.display = 'block';

                    // Auto-redirect after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 3000);
                } else {
                    throw new Error('No session found. Please try logging in.');
                }

            } catch (error) {
                console.error('Verification error:', error);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('errorMessage').textContent = error.message || 'Verification failed. Please try again.';
            }
        }

        // Run verification on page load
        handleEmailVerification();
    </script>
</body>
</html>
